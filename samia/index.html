<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste Avatar Duix</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; }
    .container { width: 100vw; height: 100vh; }
    .subtitle {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      padding: 12px 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      max-width: 80%;
      text-align: center;
    }
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      color: white;
    }
    #modal input {
      padding: 10px;
      width: 280px;
      border-radius: 8px;
      border: none;
    }
    #modal button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
  <!-- SDK oficial -->
  <script src="https://cdn.guiji.ai/duix/sdk/0.3.1/duix.js"></script>
</head>
<body>
  <div class="container"></div>
  <div class="subtitle"></div>

  <div id="modal">
    <h2>Iniciar Avatar Duix</h2>
    <input id="sign" placeholder="Cole o sign (JWT)" />
    <input id="conversationId" placeholder="Cole o conversationId" />
    <button onclick="iniciar()">Começar</button>
  </div>

  <script>
    const duix = new window.Duix();

    function iniciar() {
      const sign = document.getElementById('sign').value.trim();
      const conversationId = document.getElementById('conversationId').value.trim();

      if (!sign || !conversationId) {
        alert('Preencha o sign e o conversationId');
        return;
      }

      // Eventos úteis
      duix.on('error', err => console.error('Erro:', err));
      duix.on('initialSuccess', () => {
        console.log('SDK inicializado');
        // start precisa ser chamado após initialSuccess e preferencialmente após clique do usuário
        duix.start({ openAsr: true, muted: false })
          .then(res => console.log('Sessão iniciada', res))
          .catch(err => console.error('Falha no start', err));
      });
      duix.on('show', () => {
        document.getElementById('modal').style.display = 'none';
      });
      duix.on('speakSection', data => {
        document.querySelector('.subtitle').innerText = data.text || '';
      });
      duix.on('asrStart', () => {
        document.querySelector('.subtitle').innerText = '';
      });

      // Inicialização
      duix.init({
        sign,
        containerLable: '.container',   // atenção: é "Lable" mesmo (typo oficial)
        conversationId,
        platform: 'duix.com'
      })
      .then(data => console.log('Init OK', data))
      .catch(err => console.error('Init falhou', err));
    }

    // Boa prática: liberar recursos ao sair
    window.addEventListener('beforeunload', () => {
      if (duix) duix.stop();
    });
  </script>
</body>
</html>
