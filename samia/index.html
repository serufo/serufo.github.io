<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acolhimento Psicológico – Live Avatar</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #5c6b7a;
      --accent: #4a6fa5;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .avatar-container {
      width: 100%;
      max-width: 960px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .avatar-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f172a;
    }

    .avatar-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 1rem 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    /* Responsividade para telas menores */
    @media (max-width: 640px) {
      header h1 {
        font-size: 1.15rem;
      }
      main {
        padding: 1rem;
      }
      .avatar-container {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Acolhimento Psicológico</h1>
    <p>Espaço seguro de escuta para estudantes de ensino superior</p>
  </header>

  <main>
    <div class="avatar-container">
      <div class="avatar-wrapper">
        <iframe
          src="https://embed.liveavatar.com/v1/d48ce0f1-ff33-42f2-b92e-86ec779c3211?orientation=horizontal"
          allow="microphone"
          title="LiveAvatar Embed"
          style="aspect-ratio: 16/9;"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </main>

  <footer>
    Ambiente de acolhimento • Conversa com avatar interativo
  </footer>
</body>
</html>
