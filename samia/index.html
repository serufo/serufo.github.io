<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste Avatar Duix</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; }
    .container { width: 100vw; height: 100vh; }
    .subtitle {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      padding: 12px 20px;
      background: rgba(0,0,0,0.65);
      border-radius: 12px;
      max-width: 80%;
      text-align: center;
      font-size: 16px;
    }
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      color: white;
      font-family: system-ui, sans-serif;
    }
    #modal input {
      padding: 12px;
      width: 300px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }
    #modal button {
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #modal button:disabled {
      background: #666;
      cursor: not-allowed;
    }
  </style>

  <!-- Arquivo local (coloque o duix.js na mesma pasta) -->
  <script src="./duix.js"></script>
</head>
<body>
  <div class="container"></div>
  <div class="subtitle"></div>

  <div id="modal">
    <h2>Iniciar Avatar Duix</h2>
    <input id="sign" placeholder="Cole o sign (JWT)" />
    <input id="conversationId" placeholder="Cole o conversationId" />
    <button id="btnStart" onclick="iniciar()">Começar</button>
    <p style="font-size:13px;opacity:0.7;margin-top:8px">
      Se o botão não funcionar, verifique o console (F12)
    </p>
  </div>

  <script>
    // Verifica se o SDK carregou
    if (typeof window.Duix !== 'function') {
      console.error('SDK Duix não carregou! Verifique se o arquivo duix.js está na mesma pasta.');
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnStart').innerText = 'SDK não encontrado';
    }

    let duix = null;

    function iniciar() {
      const sign = document.getElementById('sign').value.trim();
      const conversationId = document.getElementById('conversationId').value.trim();

      if (!sign || !conversationId) {
        alert('Preencha o sign e o conversationId');
        return;
      }

      try {
        duix = new window.Duix();
      } catch (e) {
        console.error('Erro ao criar instância do Duix:', e);
        alert('Erro ao criar o SDK. Veja o console.');
        return;
      }

      // Eventos
      duix.on('error', err => {
        console.error('Erro do SDK:', err);
      });

      duix.on('initialSuccess', () => {
        console.log('SDK inicializado com sucesso');
        duix.start({ openAsr: true })
          .then(res => console.log('Sessão iniciada', res))
          .catch(err => console.error('Falha no start', err));
      });

      duix.on('show', () => {
        document.getElementById('modal').style.display = 'none';
      });

      duix.on('speakSection', data => {
        document.querySelector('.subtitle').innerText = data?.text || '';
      });

      duix.on('asrStart', () => {
        document.querySelector('.subtitle').innerText = '';
      });

      // Inicializa
      duix.init({
        sign,
        containerLable: '.container',   // "Lable" é o nome oficial (typo)
        conversationId,
        platform: 'duix.com'
      })
      .then(data => console.log('Init OK', data))
      .catch(err => {
        console.error('Init falhou', err);
        alert('Falha na inicialização. Veja o console (F12).');
      });
    }

    // Libera recursos ao sair da página
    window.addEventListener('beforeunload', () => {
      if (duix) {
        try { duix.stop(); } catch(e) {}
      }
    });
  </script>
</body>
</html>
